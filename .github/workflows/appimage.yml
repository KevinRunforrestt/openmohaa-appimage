name: Build AppImage

concurrency:
  group: build-appimage-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      openmohaa_ref:
        description: 'OpenMoHAA git ref (branch/tag/commit). Empty for latest main.'
        required: false
        default: ''
        type: string
  repository_dispatch:
    types:
      - openmohaa-new-version

jobs:
  build:
    name: Build AppImage (${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    container: ghcr.io/pkgforge-dev/archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Arch Linux container
        uses: pkgforge-dev/anylinux-setup-action@v2
      - name: Resolve OpenMoHAA ref
        id: ref
        run: |
          REF=""
          [ -n "${{ inputs.openmohaa_ref }}" ] && REF="${{ inputs.openmohaa_ref }}"
          [ -n "${{ github.event.client_payload.ref }}" ] && REF="${{ github.event.client_payload.ref }}"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
      - name: Build AppImage
        env:
          OPENMOHAA_REF: ${{ steps.ref.outputs.ref }}
          JOBS: '2'
        run: |
          chmod +x ./build.sh
          ./build.sh
      - name: Read built version
        id: version
        run: |
          VERSION="unknown"; COMMIT="unknown"
          [ -f ./LATEST_VERSION ] && VERSION="$(tr -d '[:space:]' < ./LATEST_VERSION)"
          [ -f ./LATEST_COMMIT ] && COMMIT="$(tr -d '[:space:]' < ./LATEST_COMMIT)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppImage-${{ matrix.arch }}
          path: dist
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release AppImage
    if: ${{ github.ref_name == 'main' }}
    needs: [build]
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: AppImage-*
          merge-multiple: true
      - name: Release AppImage
        uses: pkgforge-dev/make-stable-appimage-release@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: "OpenMoHAA ${{ needs.build.outputs.version }}"
          release_body: |
            # OpenMoHAA ${{ needs.build.outputs.version }}

            Upstream commit: `${{ needs.build.outputs.commit }}`

            Portable AppImage with all deps bundled (libc, ld-linux, SDL2, OpenGL, audio, X11, Wayland).
            Place .pk3 assets in main/ next to the AppImage.

            ## Usage
            ```bash
            chmod +x openmohaa-*.AppImage
            mkdir main  # put your .pk3 files here
            ./openmohaa-x86_64.AppImage
            ```

            ## Auto-update
            This release includes a `.zsync` file for delta updates. AppImage managers
            like [AM](https://github.com/ivan-hc/AM), [soar](https://github.com/pkgforge/soar),
            or [AppImageUpdate](https://github.com/AppImage/AppImageUpdate) will use it
            to download only the changed bytes when updating.

  commit:
    name: Update VERSION
    if: ${{ github.ref_name == 'main' }}
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: AppImage-x86_64
          path: ./artifact
          merge-multiple: true
      - name: Update VERSION file
        run: |
          # LATEST_VERSION is in the artifact root (was copied to dist/ in build.sh)
          VERSION_FILE="./artifact/LATEST_VERSION"
          if [ ! -f "$VERSION_FILE" ]; then
            echo "::error::LATEST_VERSION file not found in artifact!"
            echo "Contents of ./artifact/:"
            ls -la ./artifact/ || true
            exit 1
          fi
          VERSION="$(tr -d '[:space:]' < "$VERSION_FILE")"
          echo "Updating VERSION to: ${VERSION}"
          echo "$VERSION" > VERSION
      - name: Commit VERSION
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore: bump VERSION to ${{ needs.build.outputs.version }}"
          file_pattern: "VERSION"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
