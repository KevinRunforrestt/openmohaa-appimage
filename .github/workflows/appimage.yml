name: Build AppImage

concurrency:
  group: build-appimage-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      openmohaa_ref:
        description: 'OpenMoHAA git ref (branch/tag/commit). Empty for latest main.'
        required: false
        default: ''
        type: string
  repository_dispatch:
    types:
      - openmohaa-new-version

jobs:
  build:
    name: Build AppImage (${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    container: ghcr.io/pkgforge-dev/archlinux:latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            arch: x86_64
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Arch Linux container
        uses: pkgforge-dev/anylinux-setup-action@v2
      - name: Resolve OpenMoHAA ref
        id: ref
        run: |
          REF=""
          [ -n "${{ inputs.openmohaa_ref }}" ] && REF="${{ inputs.openmohaa_ref }}"
          [ -n "${{ github.event.client_payload.ref }}" ] && REF="${{ github.event.client_payload.ref }}"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
      - name: Build AppImage
        env:
          OPENMOHAA_REF: ${{ steps.ref.outputs.ref }}
          JOBS: '2'
        run: |
          chmod +x ./build.sh
          ./build.sh
      - name: Read built version
        id: version
        run: |
          VERSION="unknown"; COMMIT="unknown"
          [ -f ./LATEST_VERSION ] && VERSION="$(tr -d '[:space:]' < ./LATEST_VERSION)"
          [ -f ./LATEST_COMMIT ] && COMMIT="$(tr -d '[:space:]' < ./LATEST_COMMIT)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppImage-${{ matrix.arch }}
          path: |
            dist/*.AppImage
            dist/*.AppImage.sha256
            dist/*.AppImage.zsync
            dist/appinfo
            LATEST_VERSION
            LATEST_COMMIT
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release AppImage
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: AppImage-*
          merge-multiple: true
          path: ./dist
      - name: Copy appinfo to workflow root
        run: |
          # make-stable-appimage-release expects ./appinfo in the working directory
          if [ -f ./dist/appinfo ]; then
            cp ./dist/appinfo ./appinfo
            echo "appinfo content:"
            cat ./appinfo
          else
            echo "::error::appinfo file not found in artifact!"
            exit 1
          fi
      - name: Read version
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < ./dist/LATEST_VERSION 2>/dev/null || echo nightly)"
          COMMIT="$(tr -d '[:space:]' < ./dist/LATEST_COMMIT 2>/dev/null || echo unknown)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release with zsync
        uses: pkgforge-dev/make-stable-appimage-release@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: "OpenMoHAA ${{ steps.version.outputs.version }}"
          release_body: |
            # OpenMoHAA ${{ steps.version.outputs.version }}

            Upstream commit: `${{ steps.version.outputs.commit }}`

            Portable AppImage with all deps bundled (libc, ld-linux, SDL2, OpenGL, audio, X11, Wayland).
            Place .pk3 assets in main/ next to the AppImage.

            ## Usage
            ```bash
            chmod +x openmohaa-*.AppImage
            mkdir main  # put your .pk3 files here
            ./openmohaa-x86_64.AppImage
            ```

            ## Auto-update
            This release includes a `.zsync` file for delta updates. AppImage managers
            like [AM](https://github.com/ivan-hc/AM), [soar](https://github.com/pkgforge/soar),
            or [AppImageUpdate](https://github.com/AppImage/AppImageUpdate) will use it
            to download only the changed bytes when updating.
          release_files: |
            dist/*.AppImage
            dist/*.AppImage.sha256
            dist/*.AppImage.zsync

  commit:
    name: Update VERSION
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: AppImage-x86_64
          path: ./artifact
          merge-multiple: true
      - name: Update VERSION file
        run: |
          VERSION="$(tr -d '[:space:]' < ./artifact/LATEST_VERSION)"
          echo "Updating VERSION to: ${VERSION}"
          echo "$VERSION" > VERSION
      - name: Commit VERSION
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore: bump VERSION to ${{ needs.build.outputs.version }}"
          file_pattern: "VERSION"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
